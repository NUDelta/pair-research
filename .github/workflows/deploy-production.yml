name: 🏗️ Production Deploy (main only)

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare Worker (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: production-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}
      CONTACT_ADMIN_EMAIL: ${{ secrets.CONTACT_ADMIN_EMAIL }}
      CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      WRANGLER_LOG_PATH: .wrangler/logs

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧱 Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: 🔐 Validate release secrets
        run: pnpm run release:preflight

      - name: 🚨 Lint code
        run: pnpm run lint:ci

      - name: 🧪 Run unit tests
        run: pnpm run test:unit

      - name: ✅ Run build
        run: pnpm run build

      - name: 🚀 Deploy Worker (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: deploy
