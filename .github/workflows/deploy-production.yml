name: 🏗️ Production Deploy (main only)

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare Worker (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: production-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧱 Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: 🔐 Validate release secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_BASE_URL: ${{ secrets.VITE_SITE_BASE_URL }}
          VITE_CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_CLOUDFLARE_TURNSTILE_SITE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: pnpm run release:preflight

      - name: 🚨 Lint code
        run: pnpm run lint:ci

      - name: 🧪 Run unit tests
        run: pnpm run test

      - name: ✅ Run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_BASE_URL: ${{ secrets.VITE_SITE_BASE_URL }}
          VITE_CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_CLOUDFLARE_TURNSTILE_SITE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          BUILD_SECRET_SCAN_CANARIES: pair-research-runtime-secret-canary
        run: pnpm run build

      - name: 🚀 Deploy Worker (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: deploy --keep-vars
