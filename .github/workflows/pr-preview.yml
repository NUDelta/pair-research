name: 🚀 PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/README.md'

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: 🌐 Preview Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      VITE_SITE_BASE_URL: https://pairresearch.io
      R2_PUBLIC_DOMAIN: https://r2.pairresearch.io
      DATABASE_URL: postgresql://user:pass@example.com:5432/db
      SUPABASE_SECRET_KEY: sb_secret_ci
      VITE_CLOUDFLARE_TURNSTILE_SITE_KEY: turnstile-site
      CLOUDFLARE_TURNSTILE_SECRET_KEY: turnstile-secret
      WRANGLER_LOG_PATH: .wrangler/logs

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧱 Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: 🏗️ Run build
        run: pnpm run build

      - name: 🧾 Write preview summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 🌐 PR Preview"
            echo ""
            echo "- 🏗️ Build-only preview safety check: **${{ job.status }}**"
            echo "- 🔐 Cloudflare preview deploy: disabled for pull_request workflows to avoid exposing production secrets to PR-controlled code."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💬 Upsert preview PR comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- pair-research-pr-preview -->";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const result = "${{ job.status }}";
            const icon = result === "success" ? "✅" : result === "failure" ? "❌" : "⏭️";
            const body = [
              marker,
              "### 🌐 Pair Research PR Preview",
              "",
              `- 🏗️ Build-only preview safety check: ${icon} **${result}**`,
              "- 🔐 Cloudflare preview deploy: disabled for pull_request workflows to avoid exposing production secrets to PR-controlled code.",
              "",
              `🔗 Run: ${runUrl}`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(c => (c.body || "").includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
