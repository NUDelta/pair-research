name: 🔎 PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/README.md'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: 🔐 Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://user:pass@example.com:5432/db
      SUPABASE_SECRET_KEY: sb_secret_ci
      CLOUDFLARE_TURNSTILE_SECRET_KEY: turnstile-secret
      CONTACT_ADMIN_EMAIL: admin@example.com
      CONTACT_FROM_EMAIL: Pair Research <support@notify.pairresearch.io>
      RESEND_API_KEY: re_ci
      WRANGLER_LOG_PATH: .wrangler/logs

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧱 Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: 🔐 Run release preflight
        run: pnpm run release:preflight

  lint:
    name: 🚨 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧱 Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: 🚨 Run lint
        run: pnpm run lint:ci

  unit:
    name: 🧪 Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧱 Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: 🧪 Run unit tests
        run: pnpm run test:unit

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://user:pass@example.com:5432/db
      SUPABASE_SECRET_KEY: sb_secret_ci
      CLOUDFLARE_TURNSTILE_SECRET_KEY: turnstile-secret
      WRANGLER_LOG_PATH: .wrangler/logs

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🧱 Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: 🏗️ Run build
        run: pnpm run build

  report:
    name: 💬 Report
    runs-on: ubuntu-latest
    if: always()
    needs: [preflight, lint, unit, build]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: 🧾 Write job summary
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;

          const icon = (outcome) => outcome === 'success' ? '✅' : outcome === 'failure' ? '❌' : '⏭️';

          const lint = process.env.LINT_RESULT || 'skipped';
          const preflight = process.env.PREFLIGHT_RESULT || 'skipped';
          const unit = process.env.UNIT_RESULT || 'skipped';
          const build = process.env.BUILD_RESULT || 'skipped';

          const lines = [
            '## 🧪 PR Checks',
            '',
            `- 🔐 Release preflight: ${icon(preflight)} **${preflight}**`,
            `- 🚨 Lint: ${icon(lint)} **${lint}**`,
            `- 🧪 Unit tests: ${icon(unit)} **${unit}**`,
            `- 🏗️ Build: ${icon(build)} **${build}**`,
            '',
          ];

          fs.appendFileSync(summaryPath, lines.join('\n') + '\n');
          EOF

      - name: 💬 Upsert PR comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const marker = "<!-- pair-research-pr-checks -->";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const icon = (outcome) => (outcome === "success" ? "✅" : outcome === "failure" ? "❌" : "⏭️");

            const lint = process.env.LINT_RESULT || "skipped";
            const preflight = process.env.PREFLIGHT_RESULT || "skipped";
            const unit = process.env.UNIT_RESULT || "skipped";
            const build = process.env.BUILD_RESULT || "skipped";

            const body = [
              marker,
              "### 🧪 Pair Research PR Checks",
              "",
              `- 🔐 Release preflight: ${icon(preflight)} **${preflight}**`,
              `- 🚨 Lint: ${icon(lint)} **${lint}**`,
              `- 🧪 Unit tests: ${icon(unit)} **${unit}**`,
              `- 🏗️ Build: ${icon(build)} **${build}**`,
              "",
              `🔗 Run: ${runUrl}`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existing = comments.find(comment => (comment.body || "").includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: ❌ Fail workflow if any required check failed
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$PREFLIGHT_RESULT" = "failure" ] || \
             [ "$LINT_RESULT" = "failure" ] || \
             [ "$UNIT_RESULT" = "failure" ] || \
             [ "$BUILD_RESULT" = "failure" ]; then
            echo "One or more required PR checks failed."
            exit 1
          fi
